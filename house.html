<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Your House – Credit Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka&display=swap" rel="stylesheet">
<style>
  :root { --maxW: 1024px; }
  body { font-family: 'Fredoka', system-ui, sans-serif; background:#f7fbff; margin:0; }
  .toolbar{max-width:var(--maxW);margin:14px auto 6px;display:flex;gap:8px;justify-content:space-between;align-items:center;padding:0 10px}
  .btn{border:0;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
  .ghost{background:#eef2f7}
  .primary{background:#4f46e5;color:#fff}
  .pill{background:#eef4ff;color:#243b6b;border-radius:999px;padding:6px 10px;font-weight:700}
  .wrap{max-width:var(--maxW); margin:0 auto 18px; padding:0 10px;}
  .stage{width:100%;background:#fff;border:3px solid #1c2b3a;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.1);overflow:hidden}
  .hint{max-width:var(--maxW);margin:8px auto 0;padding:0 10px;color:#345;opacity:.8}

  /* Slot styles (applies to SVG <g>.slot) */
  .slot .silhouette { fill: rgba(79,70,229,.08); stroke:#4f46e5; stroke-width:2.5; stroke-dasharray:6 5; }
  .slot.placed .silhouette { opacity:0; }
  .slot:hover .silhouette { fill: rgba(79,70,229,.12); }
  .slot { cursor:pointer; }
  .room-label { font-weight:800; fill:#1c2b3a; opacity:.7; }
  .room-area { fill:#f7fbff; stroke:#d8e4f2; stroke-width:2; }
  .wall { stroke:#1c2b3a; stroke-width:6; }
  .door { stroke:#1c2b3a; stroke-width:4; stroke-linecap:round; }
  .divider { stroke:#1c2b3a; stroke-width:4; stroke-dasharray:12 8; opacity:.35; }
  .garage-panel { display:none; max-width:var(--maxW); margin:12px auto; padding:12px; background:#0e2233; color:#fff; border-radius:14px; }
  .garage-panel .stage{ border-color:#0e2233; box-shadow:none; }
  .legend{font-size:12px; opacity:.7}
</style>
</head>
<body>

<div class="toolbar">
  <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
    <a class="btn ghost" href="quickstart.html">⬅ Back</a>
    <span class="pill" id="coinPill">Coins: 0</span>
    <span class="pill" id="houseBadge" style="display:none">🏠 House owned</span>
  </div>
  <div style="display:flex; gap:8px;">
    <button class="btn" id="resetBtn">Reset Room</button>
    <button class="btn" id="garageToggle">View Garage</button>
  </div>
</div>

<div class="wrap">
  <!-- Responsive SVG via viewBox -->
  <svg id="houseSVG" class="stage" viewBox="0 0 1024 640" xmlns="http://www.w3.org/2000/svg" aria-label="House plan">
    <!-- Outer walls -->
    <rect x="12" y="12" width="1000" height="616" fill="#fff"/>
    <rect x="12" y="12" width="1000" height="616" fill="none" class="wall"/>

    <!-- Internal layout (four rooms) -->
    <!-- vertical divider between living+kitchen and bedroom+bath -->
    <line x1="540" y1="12" x2="540" y2="628" class="divider"/>
    <!-- horizontal divider between living and kitchen -->
    <line x1="12" y1="330" x2="540" y2="330" class="divider"/>
    <!-- horizontal divider between bedroom and bathroom -->
    <line x1="540" y1="420" x2="1012" y2="420" class="divider"/>

    <!-- Room fills (soft bg) -->
    <rect x="20" y="20" width="512" height="300" rx="10" class="room-area"/>
    <rect x="20" y="340" width="512" height="280" rx="10" class="room-area"/>
    <rect x="548" y="20" width="452" height="392" rx="10" class="room-area"/>
    <rect x="548" y="428" width="452" height="200" rx="10" class="room-area"/>

    <!-- Labels -->
    <text x="276" y="70" class="room-label" font-size="28" text-anchor="middle">LIVING ROOM</text>
    <text x="276" y="390" class="room-label" font-size="28" text-anchor="middle">KITCHEN / DINING</text>
    <text x="774" y="70" class="room-label" font-size="28" text-anchor="middle">BEDROOM</text>
    <text x="774" y="470" class="room-label" font-size="28" text-anchor="middle">BATHROOM</text>

    <!-- Doors (just visual) -->
    <path d="M540 300 q30 0 30 30" class="door" fill="none"/>
    <path d="M540 420 q30 0 30 -30" class="door" fill="none"/>

    <!-- ====== CLIP PATHS (shapes) ====== -->
    <defs>
      <!-- Sofa shape: rounded couch silhouette -->
      <clipPath id="clip-sofa">
        <path d="M60 210 q30 -40 80 -40 h180 q50 0 80 40 v60 q0 20 -20 20 h-300 q-20 0 -20 -20z
                 M100 230 a22 22 0 1 0 44 0 a22 22 0 1 0 -44 0
                 M316 230 a22 22 0 1 0 44 0 a22 22 0 1 0 -44 0" />
      </clipPath>

      <!-- Rug: ellipse -->
      <clipPath id="clip-rug">
        <ellipse cx="260" cy="540" rx="190" ry="50"/>
      </clipPath>

      <!-- TV: rounded rectangle -->
      <clipPath id="clip-tv">
        <rect x="420" y="80" width="90" height="70" rx="10" ry="10"/>
      </clipPath>

      <!-- Bed: rounded big rectangle -->
      <clipPath id="clip-bed">
        <rect x="640" y="220" width="280" height="150" rx="20" ry="20"/>
      </clipPath>

      <!-- Wardrobe: tall rect -->
      <clipPath id="clip-wardrobe">
        <rect x="900" y="100" width="80" height="170" rx="8"/>
      </clipPath>

      <!-- Bathtub: capsule -->
      <clipPath id="clip-bathtub">
        <rect x="620" y="500" width="240" height="80" rx="40"/>
      </clipPath>

      <!-- Table: rounded rect (kitchen) -->
      <clipPath id="clip-table">
        <rect x="220" y="430" width="140" height="90" rx="18"/>
      </clipPath>

      <!-- Car: rounded low rect (garage panel) -->
      <clipPath id="clip-car">
        <rect x="260" y="40" width="500" height="220" rx="60"/>
      </clipPath>
    </defs>

    <!-- ====== SLOTS (each has silhouette + <image> that we switch on place) ====== -->
    <!-- Living room: Sofa -->
    <g id="slot-sofa" class="slot" tabindex="0">
      <path class="silhouette" d="M60 210 q30 -40 80 -40 h180 q50 0 80 40 v60 q0 20 -20 20 h-300 q-20 0 -20 -20z
                 M100 230 a22 22 0 1 0 44 0 a22 22 0 1 0 -44 0
                 M316 230 a22 22 0 1 0 44 0 a22 22 0 1 0 -44 0"/>
      <image href="" x="0" y="170" width="400" height="140" preserveAspectRatio="xMidYMax meet"
             clip-path="url(#clip-sofa)"/>
    </g>

    <!-- Living room: TV -->
    <g id="slot-tv" class="slot" tabindex="0">
      <rect x="420" y="80" width="90" height="70" rx="10" class="silhouette"/>
      <image href="" x="420" y="70" width="100" height="90" preserveAspectRatio="xMidYMid meet"
             clip-path="url(#clip-tv)"/>
    </g>

    <!-- Living room: Rug -->
    <g id="slot-rug" class="slot" tabindex="0">
      <ellipse cx="260" cy="540" rx="190" ry="50" class="silhouette"/>
      <image href="" x="60" y="490" width="400" height="120" preserveAspectRatio="xMidYMid slice"
             clip-path="url(#clip-rug)"/>
    </g>

    <!-- Kitchen: Table -->
    <g id="slot-table" class="slot" tabindex="0">
      <rect x="220" y="430" width="140" height="90" rx="18" class="silhouette"/>
      <image href="" x="210" y="420" width="160" height="110" preserveAspectRatio="xMidYMid meet"
             clip-path="url(#clip-table)"/>
    </g>

    <!-- Bedroom: Bed -->
    <g id="slot-bed" class="slot" tabindex="0">
      <rect x="640" y="220" width="280" height="150" rx="20" class="silhouette"/>
      <image href="" x="630" y="210" width="300" height="170" preserveAspectRatio="xMidYMid meet"
             clip-path="url(#clip-bed)"/>
    </g>

    <!-- Bedroom: Wardrobe -->
    <g id="slot-wardrobe" class="slot" tabindex="0">
      <rect x="900" y="100" width="80" height="170" rx="8" class="silhouette"/>
      <image href="" x="890" y="90" width="100" height="190" preserveAspectRatio="xMidYMid meet"
             clip-path="url(#clip-wardrobe)"/>
    </g>

    <!-- Bathroom: Bathtub -->
    <g id="slot-bathtub" class="slot" tabindex="0">
      <rect x="620" y="500" width="240" height="80" rx="40" class="silhouette"/>
      <image href="" x="610" y="490" width="260" height="100" preserveAspectRatio="xMidYMid meet"
             clip-path="url(#clip-bathtub)"/>
    </g>
  </svg>
</div>

<!-- Garage panel -->
<div id="garagePanel" class="garage-panel">
  <div class="stage">
    <svg viewBox="0 0 1024 320" xmlns="http://www.w3.org/2000/svg" width="100%" aria-label="Garage">
      <rect x="12" y="12" width="1000" height="296" fill="#052033" stroke="#3da9fc" stroke-width="3" rx="12"/>
      <text x="512" y="40" text-anchor="middle" fill="#fff" font-size="26" font-weight="800">GARAGE</text>

      <defs>
        <clipPath id="clip-car-inline">
          <rect x="260" y="70" width="500" height="180" rx="60"/>
        </clipPath>
      </defs>

      <g id="slot-car" class="slot" tabindex="0">
        <rect x="260" y="70" width="500" height="180" rx="60" class="silhouette" fill="rgba(255,255,255,.1)" stroke="#fff"/>
        <image href="" x="240" y="50" width="540" height="220" preserveAspectRatio="xMidYMid meet"
               clip-path="url(#clip-car-inline)"/>
      </g>

      <text x="512" y="300" text-anchor="middle" class="legend" fill="#fff">Click the shape to place your car</text>
    </svg>
  </div>
</div>

<p class="hint">Tip: buy furniture in the Shop first. Clicking a shape places the item if you own it. Click again to clear.</p>

<script>
  /* ====== OWNERSHIP + ART MAP (ids must match SHOP_ITEMS in your script.js) ====== */
  const ITEMS = {
    'house-basic'   : { art:'' }, // gate to enter
    'furn-sofa'     : { art:'assets/house/sofa.png' },
    'furn-rug'      : { art:'assets/house/rug2.png' },
    'furn-tv'       : { art:'assets/house/tv.png' },
    'furn-bed'      : { art:'assets/house/bed.png' },
    'furn-wardrobe' : { art:'' },              // add when ready
    'furn-bathtub'  : { art:'' },              // add when ready
    'furn-table'    : { art:'' },              // add when ready
    'car-basic'     : { art:'' }               // add when ready
  };

  // Slot -> item required
  const SLOT_NEEDS = {
    'slot-sofa'     : 'furn-sofa',
    'slot-rug'      : 'furn-rug',
    'slot-tv'       : 'furn-tv',
    'slot-bed'      : 'furn-bed',
    'slot-wardrobe' : 'furn-wardrobe',
    'slot-bathtub'  : 'furn-bathtub',
    'slot-table'    : 'furn-table',
    'slot-car'      : 'car-basic'
  };

  const OWN_PREFIX = 'own_';
  const PL_KEY = 'housePlacements';
  const placements = JSON.parse(localStorage.getItem(PL_KEY) || '{}');

  function owns(id){ return localStorage.getItem(OWN_PREFIX + id) === '1'; }
  function save(){ localStorage.setItem(PL_KEY, JSON.stringify(placements)); }
  function coinPill(){ const el = document.getElementById('coinPill'); if(el) el.textContent = 'Coins: ' + (localStorage.getItem('playerCoins') || 0); }

  function gate(){
    if (owns('house-basic')) {
      document.getElementById('houseBadge').style.display='inline-block';
      return;
    }
    alert('You need to buy the 🏠 Starter House (60 coins) in the Shop first.');
    location.href='quickstart.html';
  }

  function renderSlot(slotId){
    const g = document.getElementById(slotId);
    if (!g) return;
    const need = SLOT_NEEDS[slotId];
    const img = g.querySelector('image');
    const itemId = placements[slotId];
    if (itemId && ITEMS[itemId]?.art) {
      img.setAttribute('href', ITEMS[itemId].art);
      g.classList.add('placed');
    } else {
      img.setAttribute('href', '');
      g.classList.remove('placed');
    }
  }

  function place(slotId){
    const need = SLOT_NEEDS[slotId];
    if (!need) return;
    if (!owns(need)) { alert("You don't own this yet. Buy it in the Shop."); return; }
    placements[slotId] = need;
    save(); renderSlot(slotId);
  }

  function clearSlot(slotId){
    delete placements[slotId]; save(); renderSlot(slotId);
  }

  function wire(slotId){
    const g = document.getElementById(slotId);
    if (!g) return;
    g.addEventListener('click', ()=>{
      if (placements[slotId]) {
        if (confirm('Remove this item?')) clearSlot(slotId);
      } else {
        place(slotId);
      }
    });
    g.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); g.click(); }});
  }

  // Garage toggle
  document.getElementById('garageToggle').addEventListener('click', ()=>{
    const panel = document.getElementById('garagePanel');
    const show = panel.style.display !== 'block';
    panel.style.display = show ? 'block' : 'none';
    document.getElementById('garageToggle').textContent = show ? 'Hide Garage' : 'View Garage';
  });

  // Reset
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    if (!confirm('Reset all placed items?')) return;
    Object.keys(placements).forEach(k => delete placements[k]);
    save();
    Object.keys(SLOT_NEEDS).forEach(renderSlot);
  });

  // Boot
  (()=>{
    coinPill(); gate();
    Object.keys(SLOT_NEEDS).forEach(wire);
    Object.keys(SLOT_NEEDS).forEach(renderSlot);
  })();
</script>
</body>
</html>
