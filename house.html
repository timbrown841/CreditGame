<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Your House – Credit Quest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>

  <style>
    :root { --gap: 14px; }
    body{
      margin:0; font-family: Fredoka, system-ui, -apple-system, Segoe UI, Arial, sans-serif;
      background:#f7fafc;
    }
    header{
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 16px; background:#00c4cc; color:#00343d;
    }
    header h1{ margin:0; font-size:1.25rem; }
    header .actions{ display:flex; gap:8px; }
    header button, .room button.inline{
      background:#fff; border:1px solid #dcdcdc; border-radius:10px; padding:8px 12px; cursor:pointer;
    }

    /* Grid of rooms */
    .house{
      max-width:1200px; margin:18px auto; padding:0 var(--gap);
      display:grid; grid-template-columns: 1fr 1fr; gap: var(--gap);
    }

    .room{
      position:relative;
      aspect-ratio: 16 / 10;         /* modern browsers */
      min-height: 260px;              /* <- fallback so you always see a box */
      background:#eef2f6;             /* visible even if image fails */
      border-radius:16px; overflow:hidden;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      border:1px solid rgba(0,0,0,.08);
    }
    
    /* background image as an <img> so a broken path is obvious */
    .room .room-bg{
      position:absolute; inset:0;
      width:100%; height:100%;
      object-fit:cover; object-position:center;
      display:block;
    }

    .room .label{
      position:absolute; left:10px; top:10px;
      background: rgba(255,255,255,.85);
      padding:4px 8px; border-radius:999px; font-size:.9rem;
      border:1px dashed #bbb;
    }

    /* Placement layer */
    .room .stage{
      position:absolute; inset:0;
    }

    /* Placeholder base style (shape comes from the SVG path) */
    .slot{
      position:absolute;
      cursor:pointer;
      opacity:.9;
      transition: transform .15s ease;
    }
    .slot:hover{ transform: scale(1.03); }

    /* The dashed outline look */
    .slot svg{
      width:100%; height:100%;
      stroke:#5c6b7a; stroke-width:3; stroke-dasharray:8 6;
      fill: rgba(92, 107, 122, .10);
      filter: drop-shadow(0 1px 0 rgba(0,0,0,.06));
    }

    /* When an item is placed, we show the PNG instead of the dashed path */
    .placed{
      position:absolute; user-select:none; touch-action:none; cursor:grab;
    }
    .placed:active{ cursor:grabbing; }

    /* Small legend */
    .legend{
      max-width:1200px; margin:0 auto 14px; padding:0 var(--gap);
      color:#556; font-size:.95rem;
    }

    /* Mobile */
    @media (max-width: 880px){
      .house{ grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>🏠 Your House</h1>
  <div class="actions">
    <button onclick="window.location.href='quickstart.html'">⬅ Back</button>
    <button onclick="saveLayout()">💾 Save layout</button>
    <button onclick="resetLayout()">↺ Reset</button>
  </div>
</header>

<p class="legend">
  Tip: Click a dashed shape to place your furniture. You must own the item from the Shop first.
  Drag items to reposition. Your layout is saved on this device.
</p>

<div id="house" class="house">
  <!-- LIVING ROOM -->
  <section id="room-living" class="room">
    <img class="room-bg" src="assets/house/rooms/livingroom.jpg" alt="Living room">
    <span class="label">Living Room</span>
    <div class="stage"></div>
    <!-- slots stay the same -->
  </section>


    <!-- Sofa placeholder (rounded sofa silhouette) -->
    <div class="slot" data-slot="sofa" title="Sofa"
         style="left:10%; bottom:8%; width:38%; height:30%;">
      <svg viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet">
        <path d="M10,35 Q10,20 25,20 H75 Q90,20 90,35 V45 Q90,52 82,52 H18 Q10,52 10,45 Z
                 M22,25 Q22,15 35,15 H45 Q58,15 58,25
                 M55,25 Q55,15 70,15 H78 Q88,15 88,25" />
      </svg>
    </div>

    <!-- TV placeholder (old TV silhouette – fits your tv.png) -->
    <div class="slot" data-slot="tv" title="TV"
         style="right:8%; top:12%; width:22%; height:28%;">
      <svg viewBox="0 0 100 100">
        <rect x="8" y="22" rx="6" ry="6" width="84" height="60"></rect>
        <line x1="28" y1="10" x2="50" y2="24"></line>
        <line x1="72" y1="10" x2="50" y2="24"></line>
        <rect x="42" y="82" width="16" height="6" rx="2"></rect>
      </svg>
    </div>

    <!-- Rug placeholder (ellipse) -->
    <div class="slot" data-slot="rug" title="Rug"
         style="left:28%; bottom:2%; width:44%; height:18%;">
      <svg viewBox="0 0 100 50">
        <ellipse cx="50" cy="25" rx="46" ry="18"></ellipse>
      </svg>
    </div>
  </section>

  <!-- KITCHEN -->
  <section id="room-kitchen" class="room">
    <img class="room-bg" src="assets/house/rooms/kitchen.jpg" alt="Kitchen">
    <span class="label">Kitchen</span>
    <div class="stage"></div>
    …
  </section>

    <!-- Mobile Phone placeholder (countertop-ish rounded rect) -->
    <div class="slot" data-slot="phone" title="Mobile Phone"
         style="left:50%; top:40%; width:10%; height:14%;">
      <svg viewBox="0 0 100 160">
        <rect x="12" y="8" width="76" height="144" rx="12" ry="12"></rect>
      </svg>
    </div>

    <!-- Table placeholder -->
    <div class="slot" data-slot="table" title="Table"
         style="left:14%; bottom:8%; width:26%; height:22%;">
      <svg viewBox="0 0 120 80">
        <rect x="8" y="12" width="104" height="40" rx="6"></rect>
        <rect x="18" y="52" width="10" height="20"></rect>
        <rect x="92" y="52" width="10" height="20"></rect>
      </svg>
    </div>
  </section>

  <!-- BEDROOM -->
  <section id="room-bedroom" class="room">
    <img class="room-bg" src="assets/house/rooms/bedroom.jpg" alt="Bedroom">
    <span class="label">Bedroom</span>
    <div class="stage"></div>
    …
  </section>

    <!-- Bed placeholder (your bed.png proportions) -->
    <div class="slot" data-slot="bed" title="Bed"
         style="left:12%; bottom:6%; width:60%; height:34%;">
      <svg viewBox="0 0 120 70">
        <rect x="6" y="22" width="108" height="36" rx="6"></rect>
        <rect x="6" y="14" width="108" height="12" rx="4"></rect>
        <rect x="6" y="8" width="108" height="8" rx="3"></rect>
      </svg>
    </div>

    <!-- Wardrobe placeholder -->
    <div class="slot" data-slot="wardrobe" title="Wardrobe"
         style="right:6%; bottom:10%; width:20%; height:50%;">
      <svg viewBox="0 0 80 160">
        <rect x="6" y="8" width="68" height="144" rx="6"></rect>
        <line x1="40" y1="8" x2="40" y2="152"></line>
      </svg>
    </div>
  </section>

  <!-- BATHROOM -->
  <section id="room-bathroom" class="room">
    <img class="room-bg" src="assets/house/rooms/bathroom.jpg" alt="Bathroom">
    <span class="label">Bathroom</span>
    <div class="stage"></div>
    …
  </section>

    <!-- Bathtub placeholder -->
    <div class="slot" data-slot="bathtub" title="Bathtub"
         style="left:50%; bottom:8%; width:44%; height:30%;">
      <svg viewBox="0 0 140 80">
        <path d="M10,30 Q10,18 24,18 H116 Q130,18 130,30 V45 Q130,58 116,58 H24 Q10,58 10,45 Z" />
        <circle cx="40" cy="62" r="6"></circle>
        <circle cx="100" cy="62" r="6"></circle>
      </svg>
    </div>
  </section>
</div>

<script>
/* ------------ CONFIG ------------ */
const FRONT_ITEMS = {
  sofa:    { itemId: 'furn-sofa',     img: 'assets/house/items/sofa.png',    w: 420, h: 250 },
  tv:      { itemId: 'furn-tv',       img: 'assets/house/items/tv.png',      w: 260, h: 220 },
  rug:     { itemId: 'furn-rug',      img: 'assets/house/items/rug2.png',    w: 500, h: 180 },
  phone:   { itemId: 'furn-phone',    img: 'assets/house/items/phone.png',   w: 120, h: 200 },
  table:   { itemId: 'furn-table',    img: 'assets/house/items/table.png',   w: 280, h: 200 },
  bed:     { itemId: 'furn-bed',      img: 'assets/house/items/bed.png',     w: 640, h: 360 },
  wardrobe:{ itemId: 'furn-wardrobe', img: 'assets/house/items/wardrobe.png',w: 260, h: 520 },
  bathtub: { itemId: 'furn-bathtub',  img: 'assets/house/items/bathtub.png', w: 520, h: 260 },
};

// key under which we store positions per device
const LAYOUT_KEY = 'house_layout_v1';

/* ------------ HELPERS ------------ */
function owns(itemId){
  // your shop sets "own_<id>" to "1" on purchase
  return localStorage.getItem('own_' + itemId) === '1';
}

function loadLayout(){
  try { return JSON.parse(localStorage.getItem(LAYOUT_KEY) || '{}'); }
  catch { return {}; }
}

function saveLayout(){
  const state = {};
  document.querySelectorAll('.placed').forEach(el => {
    const roomId = el.closest('.room').id;
    const slot   = el.dataset.slot;
    state[roomId] = state[roomId] || {};
    state[roomId][slot] = {
      left: el.style.left, top: el.style.top, width: el.style.width
    };
  });
  localStorage.setItem(LAYOUT_KEY, JSON.stringify(state));
  alert('✅ Layout saved!');
}

function resetLayout(){
  if (!confirm('Reset layout on this device?')) return;
  localStorage.removeItem(LAYOUT_KEY);
  document.querySelectorAll('.placed').forEach(n => n.remove());
  document.querySelectorAll('.slot').forEach(n => n.style.display = '');
}

/* ------------ INIT: wire slots ------------ */
document.querySelectorAll('.slot').forEach(slot => {
  const slotKey = slot.dataset.slot;
  const meta = FRONT_ITEMS[slotKey];
  slot.addEventListener('click', () => {
    if (!meta) return;

    if (!owns(meta.itemId)) {
      alert(`You don't own the ${slotKey} yet. Buy it in the 🛍️ Shop first.`);
      return;
    }
    // Hide the dashed placeholder & place the image
    placeItem(slot, meta);
  });
});

function placeItem(slotEl, meta){
  const roomEl = slotEl.closest('.room');
  const stage  = roomEl.querySelector('.stage');

  // If already placed, just reveal/make draggable
  const existing = stage.querySelector(`.placed[data-slot="${slotEl.dataset.slot}"]`);
  if (existing){ existing.style.display='block'; slotEl.style.display='none'; return; }

  const img = new Image();
  img.src = meta.img;
  img.alt = slotEl.dataset.slot;
  img.className = 'placed';
  img.dataset.slot = slotEl.dataset.slot;
  // Size the image to roughly the placeholder box
  const rect = slotEl.getBoundingClientRect();
  const parent = stage.getBoundingClientRect();
  const wPct = (rect.width / parent.width) * 100;
  const leftPct = ((rect.left - parent.left) / parent.width) * 100;
  const topPct  = ((rect.top  - parent.top ) / parent.height) * 100;

  Object.assign(img.style, {
    position:'absolute', width: wPct + '%',
    left: leftPct + '%', top: topPct + '%'
  });

  stage.appendChild(img);
  slotEl.style.display = 'none';
  makeDraggable(img);
}

/* ------------ DRAG / POSITION ------------ */
function makeDraggable(el){
  let startX=0,startY=0, baseLeft=0, baseTop=0, dragging=false;

  const down = (e)=>{
    dragging=true; el.style.cursor='grabbing';
    const p = pointer(e);
    startX = p.x; startY = p.y;
    const rect = el.getBoundingClientRect();
    const pr   = el.parentElement.getBoundingClientRect();
    baseLeft = ((rect.left - pr.left) / pr.width) * 100;
    baseTop  = ((rect.top  - pr.top ) / pr.height) * 100;
    e.preventDefault();
  };

  const move = (e)=>{
    if(!dragging) return;
    const p = pointer(e);
    const pr = el.parentElement.getBoundingClientRect();
    const dx = ((p.x - startX) / pr.width) * 100;
    const dy = ((p.y - startY) / pr.height) * 100;
    el.style.left = (baseLeft + dx) + '%';
    el.style.top  = (baseTop  + dy) + '%';
  };

  const up = ()=>{
    dragging=false; el.style.cursor='grab';
  };

  el.addEventListener('mousedown', down);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
  el.addEventListener('touchstart', down, {passive:false});
  window.addEventListener('touchmove', move, {passive:false});
  window.addEventListener('touchend', up);
}

function pointer(e){
  if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

/* ------------ Rehydrate from saved layout ------------ */
(function hydrate(){
  const state = loadLayout();
  for (const roomId in state){
    const roomEl = document.getElementById(roomId);
    if (!roomEl) continue;
    const stage = roomEl.querySelector('.stage');
    for (const slot in state[roomId]){
      const meta = FRONT_ITEMS[slot];
      const pos = state[roomId][slot];
      // show only if still owned
      if (!meta || !owns(meta.itemId)) continue;

      const img = new Image();
      img.src = meta.img; img.alt = slot; img.className='placed'; img.dataset.slot = slot;
      Object.assign(img.style, { position:'absolute', left: pos.left, top: pos.top, width: pos.width || '30%' });
      stage.appendChild(img);
      makeDraggable(img);
      // hide placeholder for this slot
      const ph = roomEl.querySelector(`.slot[data-slot="${slot}"]`);
      if (ph) ph.style.display='none';
    }
  }
})();
</script>
</body>
</html>
