<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your House — Credit Quest</title>
<link rel="icon" href="assets/icons/favicon.ico" sizes="any" />

<style>
  :root{
    --ink:#101828;
    --muted:#6b7280;
    --brand:#00c4cc;
    --wall:#f9fafb;
    --floor:#eef2f7;
    --tile:#dbeafe;
    --wood:#f6e3c2;
    --slot:#e8f1ff;
    --slot-line:#6aa3ff;
    --frame:#0f172a;
  }
  *{box-sizing:border-box}
  body{margin:0; font-family:system-ui,Segoe UI,Roboto,Arial; background:#f6faff; color:var(--ink)}

  header{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; gap:10px;
    padding:12px 16px; background:#fff; border-bottom:1px solid rgba(0,0,0,.06)
  }
  .spacer{flex:1}
  button,a.btn{appearance:none; border:1px solid rgba(0,0,0,.12); background:#fff; color:#1f2937;
    padding:8px 12px; border-radius:10px; font-weight:600; text-decoration:none; cursor:pointer}
  .primary{background:#4f46e5; color:#fff; border-color:transparent}
  .subtle{color:var(--muted); border-color:transparent; background:transparent}

  .wrap{max-width:1100px; margin:16px auto; padding:0 16px}

  /* --- House shell --- */
  .house{
    margin:0 auto; width:min(94vmin, 920px); aspect-ratio:1;
    background:#fff; border:6px solid var(--frame); border-radius:18px; overflow:hidden;
    box-shadow:0 14px 40px rgba(12,20,40,.08);
  }
  .rooms{
    position:relative; inset:0; display:grid; gap:10px; padding:10px;
    grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr;
    height:100%;
  }

  /* --- Room base: wall + floor feel --- */
  .room{
    position:relative; border:2px solid var(--frame); border-radius:14px; overflow:hidden;
    background:
      linear-gradient(#fff, #fff) padding-box,
      repeating-linear-gradient(90deg, transparent 0 48px, rgba(0,0,0,.02) 48px 49px) border-box;
  }
  .room .skin{
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, var(--wall) 0 58%, transparent 58%),
      linear-gradient(180deg, rgba(0,0,0,.03), rgba(0,0,0,.03)) ;
  }

  /* room-specific floors */
  .living .skin{
    background:
      linear-gradient(180deg, var(--wall) 0 55%, transparent 55%),
      /* wood planks */
      repeating-linear-gradient(90deg, rgba(155, 118, 68,.15) 0 14px, rgba(155,118,68,.1) 14px 28px),
      linear-gradient(180deg, #fef9f3 0 55%, #f2e3c9 55% 100%);
  }
  .kitchen .skin{
    background:
      linear-gradient(180deg, var(--wall) 0 60%, transparent 60%),
      repeating-linear-gradient(45deg, var(--tile) 0 22px, #fff 22px 44px),
      linear-gradient(180deg, #fff 0 60%, #eaf2ff 60% 100%);
  }
  .bedroom .skin{
    background:
      linear-gradient(180deg, var(--wall) 0 55%, transparent 55%),
      linear-gradient(180deg, #fff 0 55%, #f3f0ff 55% 100%);
  }
  .bathroom .skin{
    background:
      linear-gradient(180deg, var(--wall) 0 55%, transparent 55%),
      repeating-linear-gradient(90deg, #d1fae5 0 32px, #e7fff5 32px 64px),
      linear-gradient(180deg, #fff 0 55%, #eafff5 55% 100%);
  }

  /* title bars */
  .title{
    position:absolute; left:0; right:0; top:0; height:34px; display:flex; align-items:center; gap:8px;
    padding:0 12px; font-weight:800; letter-spacing:.3px; color:#0b1220;
    background:linear-gradient(180deg, #ffffffaa, #ffffff90); backdrop-filter:saturate(1.1) blur(2px);
    border-bottom:1px solid rgba(0,0,0,.07); z-index:2;
  }
  .title small{color:var(--muted); font-weight:600}

  .stage{position:absolute; inset:34px 10px 10px 10px}

  /* ---- Furniture placeholders (shapes) ---- */
  .slot{
    position:absolute; cursor:pointer; user-select:none;
    outline:2px dashed var(--slot-line);
    background:
      repeating-linear-gradient(45deg, var(--slot), var(--slot) 10px, #ffffff 10px, #ffffff 20px);
    opacity:.95;
    transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease, outline-color .12s;
  }
  .slot:hover{ transform:translateY(-1px); box-shadow:0 10px 24px rgba(0,0,0,.08) }
  .slot.placed{ background:transparent; outline-color:transparent; opacity:1 }
  .slot img{
    position:absolute; inset:0; margin:auto; max-width:100%; max-height:100%;
    object-fit:contain; display:none; filter:drop-shadow(0 10px 14px rgba(0,0,0,.18));
    pointer-events:none;
  }
  .slot.placed img{ display:block }

  .hint{ position:absolute; left:0; right:0; bottom:-20px; text-align:center; font-size:11px; color:var(--muted) }

  /* Sofa shape (rounded seat + back via pseudo) */
  .sofa{ width:58%; height:22%; left:20%; bottom:8%; border-radius:26px/20px }
  .sofa::before{ content:""; position:absolute; left:6%; right:6%; top:-42%; height:140%; border-radius:26px/28px; background:inherit; outline:inherit }

  /* Rug ellipse */
  .rug{ width:66%; height:18%; left:17%; bottom:4%; border-radius:999px }

  /* TV as rounded rect + tiny stand */
  .tv{ width:46%; height:16%; right:8%; top:8%; border-radius:12px }
  .tv::after{ content:""; position:absolute; left:45%; bottom:-10px; width:10%; height:10px; background:inherit; border-radius:4px }

  /* Coffee table */
  .coffee{ width:28%; height:12%; left:36%; bottom:22%; border-radius:12px }

  /* Cabinet */
  .cabinet{ width:40%; height:12%; left:8%; top:12%; border-radius:10px }

  /* Kitchen */
  .table{ width:42%; height:18%; left:10%; bottom:16%; border-radius:12px }
  .phone{ width:9%; height:10%; right:12%; top:18%; border-radius:6px }

  /* Bedroom */
  .bed{ width:64%; height:26%; left:18%; bottom:10%; border-radius:18px }
  .bed::before, .bed::after{ content:""; position:absolute; top:-30%; width:34%; height:55%; background:inherit; border-radius:12px }
  .bed::before{ left:8% } .bed::after{ right:8% }
  .wardrobe{ width:22%; height:48%; right:8%; bottom:10%; border-radius:10px }

  /* Bathroom */
  .bathtub{ width:70%; height:24%; left:15%; bottom:8%; border-radius:999px }
  .bathtub::after{
    content:""; position:absolute; right:10%; top:-12%; width:18%; height:18%;
    border-top-left-radius:999px; border-top-right-radius:999px; border:4px solid var(--slot-line); border-bottom:none;
    background:transparent;
  }

  /* responsive tweaks */
  @media (max-width: 740px){
    .title{height:30px; font-size:13px}
    .stage{inset:30px 8px 8px}
  }
</style>
</head>
<body>

<header>
  <a class="btn" href="quickstart.html">← Back</a>
  <div class="spacer"></div>
  <button id="reset" class="btn">Reset layout</button>
</header>

<div class="wrap">
  <div class="house">
    <div class="rooms">

      <!-- LIVING ROOM -->
      <section class="room living">
        <div class="skin"></div>
        <div class="title">Living Room <small>sofa • rug • tv • coffee table • cabinet</small></div>
        <div class="stage">
          <div class="slot sofa" data-item="furn-sofa" data-img="assets/furniture/sofa.png">
            <span class="hint">Sofa</span><img alt="Sofa">
          </div>
          <div class="slot rug" data-item="furn-rug" data-img="assets/furniture/rug2.png">
            <span class="hint">Rug</span><img alt="Rug">
          </div>
          <div class="slot tv" data-item="furn-tv" data-img="assets/furniture/tv.png">
            <span class="hint">TV</span><img alt="TV">
          </div>
          <div class="slot coffee" data-item="furn-table" data-img="assets/furniture/table.png">
            <span class="hint">Coffee Table</span><img alt="Table">
          </div>
          <div class="slot cabinet" data-item="furn-cabinet" data-img="assets/furniture/cabinet.png">
            <span class="hint">Cabinet</span><img alt="Cabinet">
          </div>
        </div>
      </section>

      <!-- KITCHEN -->
      <section class="room kitchen">
        <div class="skin"></div>
        <div class="title">Kitchen <small>table • phone</small></div>
        <div class="stage">
          <div class="slot table" data-item="furn-table" data-img="assets/furniture/table.png">
            <span class="hint">Table</span><img alt="Table">
          </div>
          <div class="slot phone" data-item="furn-phone" data-img="assets/furniture/phone.png">
            <span class="hint">Phone</span><img alt="Phone">
          </div>
        </div>
      </section>

      <!-- BEDROOM -->
      <section class="room bedroom">
        <div class="skin"></div>
        <div class="title">Bedroom <small>bed • wardrobe</small></div>
        <div class="stage">
          <div class="slot bed" data-item="furn-bed" data-img="assets/furniture/bed.png">
            <span class="hint">Bed</span><img alt="Bed">
          </div>
          <div class="slot wardrobe" data-item="furn-wardrobe" data-img="assets/furniture/wardrobe.png">
            <span class="hint">Wardrobe</span><img alt="Wardrobe">
          </div>
        </div>
      </section>

      <!-- BATHROOM -->
      <section class="room bathroom">
        <div class="skin"></div>
        <div class="title">Bathroom <small>bathtub</small></div>
        <div class="stage">
          <div class="slot bathtub" data-item="furn-bathtub" data-img="assets/furniture/bathtub.png">
            <span class="hint">Bathtub</span><img alt="Bathtub">
          </div>
        </div>
      </section>

    </div>
  </div>
</div>

<script>
  // Item ownership (your shop already sets own_<id> to "1" in localStorage)
  function owns(itemId){ return localStorage.getItem("own_" + itemId) === "1"; }

  // Per-user persistence
  const user = (localStorage.getItem("playerName") || "").trim();
  const STORE_KEY = "house_layout_" + user;
  function loadLayout(){ try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch { return {}; } }
  function saveLayout(state){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  const state = loadLayout();

  // Initialize slots
  document.querySelectorAll(".slot").forEach(slot => {
    const id = slot.dataset.item;
    const img = slot.querySelector("img");
    const src = slot.dataset.img;
    if (src) img.src = src;

    // restore placement
    if (state[id]) slot.classList.add("placed");

    slot.addEventListener("click", () => {
      if (!owns(id)) { alert("You don't own this yet — buy it in the Shop."); return; }
      slot.classList.toggle("placed");
      state[id] = slot.classList.contains("placed");
      saveLayout(state);
    }, { passive:true });
  });

  // Reset
  document.getElementById("reset").addEventListener("click", () => {
    if (!confirm("Remove all placed items?")) return;
    document.querySelectorAll(".slot.placed").forEach(s => s.classList.remove("placed"));
    saveLayout({});
  });
</script>

</body>
</html>
