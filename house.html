<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your House — Credit Quest</title>
<link rel="icon" href="assets/icons/favicon.ico" sizes="any" />

<style>
  :root{
    --ink:#0b1220;
    --muted:#6b7280;
    --brand:#00c4cc;
    --slot:#dff0ff;
    --slot-outline:#6aa3ff;
    --wall:#f7fafc;
    --floor:#eef2f7;
  }
  *{box-sizing:border-box}
  body{margin:0; font-family:system-ui,Segoe UI,Roboto,Arial; background:#f8fbff; color:var(--ink)}
  header{display:flex; align-items:center; gap:10px; padding:12px 14px; background:#fff; border-bottom:1px solid rgba(0,0,0,.08); position:sticky; top:0; z-index:5}
  header .spacer{flex:1}
  button,a.btn{
    appearance:none; border:1px solid rgba(0,0,0,.1); background:#fff; color:#1f2937;
    padding:8px 12px; border-radius:10px; font-weight:600; text-decoration:none; cursor:pointer;
  }
  .primary{background:#4f46e5; color:#fff; border-color:transparent}

  /* --- House board --- */
  .wrap{max-width:1100px; margin:16px auto; padding:0 16px}
  .house{
    margin:0 auto; width:min(92vmin, 880px); aspect-ratio:1;
    background:#fff; border:6px solid #1f2937; border-radius:18px; position:relative;
    box-shadow:0 10px 30px rgba(12,20,40,.08);
    overflow:hidden;
  }
  .rooms{
    position:absolute; inset:10px;
    display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:10px;
  }
  .room{
    position:relative; border:2px solid #1f2937; border-radius:12px; overflow:hidden;
    background:
      linear-gradient(180deg, var(--wall) 0 55%, var(--floor) 55% 100%);
  }
  .room .label{
    position:absolute; left:10px; top:10px; padding:4px 8px; border-radius:999px;
    background:#fff; border:1px solid rgba(0,0,0,.12); font-size:12px; font-weight:700;
  }
  .stage{position:absolute; inset:0; padding:16px}

  /* ---- PLACEHOLDERS (shapes) ---- */
  .slot{
    position:absolute; cursor:pointer; user-select:none;
    outline:2px dashed var(--slot-outline);
    background:repeating-linear-gradient(45deg, var(--slot), var(--slot) 8px, #ffffff 8px, #ffffff 16px);
    transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .slot:hover{ transform:translateY(-1px); box-shadow:0 8px 18px rgba(0,0,0,.08) }
  .slot .hint{ position:absolute; left:0; right:0; bottom:-22px; text-align:center; font-size:11px; color:var(--muted) }
  .slot img{
    position:absolute; inset:0; margin:auto; max-width:100%; max-height:100%;
    object-fit:contain; display:none; pointer-events:none;
  }
  .slot.placed{ outline-color:transparent; background:transparent }
  .slot.placed img{ display:block }

  /* Sofa shape: seat (rounded rect) + back via before */
  .sofa{ width:58%; height:22%; left:20%; bottom:10%; border-radius:26px/20px }
  .sofa::before{ content:""; position:absolute; left:6%; right:6%; top:-38%; height:140%; border-radius:26px/28px; background:inherit; outline:inherit }

  /* Rug: ellipse */
  .rug{ width:64%; height:18%; left:18%; bottom:6%; border-radius:999px }

  /* TV: rounded rectangle with little stand */
  .tv{ width:46%; height:14%; right:8%; top:10%; border-radius:12px }
  .tv::after{ content:""; position:absolute; left:45%; bottom:-10px; width:10%; height:10px; background:inherit; border-radius:4px }

  /* Coffee table: rounded rect */
  .coffee{ width:28%; height:12%; left:36%; bottom:22%; border-radius:12px }

  /* Cabinet: low wide rect */
  .cabinet{ width:40%; height:12%; left:8%; top:12%; border-radius:10px }

  /* Kitchen shapes */
  .table{ width:40%; height:16%; left:10%; bottom:16%; border-radius:12px }
  .phone{ width:9%; height:9%; right:12%; top:20%; border-radius:6px }

  /* Bedroom shapes */
  .bed{ width:62%; height:24%; left:18%; bottom:12%; border-radius:18px }
  .bed::before, .bed::after{ content:""; position:absolute; top:-30%; width:34%; height:55%; background:inherit; border-radius:12px }
  .bed::before{ left:8% } .bed::after{ right:8% }
  .wardrobe{ width:20%; height:46%; right:8%; bottom:12%; border-radius:10px }

  /* Bathroom shapes */
  .bathtub{ width:68%; height:22%; left:16%; bottom:12%; border-radius:999px }
  .bathtub::after{
    content:""; position:absolute; right:10%; top:-12%; width:18%; height:18%;
    border-top-left-radius:999px; border-top-right-radius:999px; border:4px solid var(--slot-outline); border-bottom:none;
    background:transparent;
  }

  /* legend */
  .legend{max-width:880px; margin:10px auto 0; padding:0 16px; color:var(--muted); font-size:14px}
</style>
</head>
<body>

<header>
  <a class="btn" href="quickstart.html">← Back</a>
  <div class="spacer"></div>
  <button id="reset" class="btn">Reset layout</button>
</header>

<div class="wrap">
  <div class="house">
    <div class="rooms">

      <!-- LIVING ROOM -->
      <section class="room" id="room-living">
        <span class="label">Living Room</span>
        <div class="stage">
          <!-- sofa -->
          <div class="slot sofa" data-item="furn-sofa" data-img="assets/furniture/sofa.png">
            <span class="hint">Sofa</span><img alt="Sofa">
          </div>
          <!-- rug -->
          <div class="slot rug" data-item="furn-rug" data-img="assets/furniture/rug2.png">
            <span class="hint">Rug</span><img alt="Rug">
          </div>
          <!-- tv -->
          <div class="slot tv" data-item="furn-tv" data-img="assets/furniture/tv.png">
            <span class="hint">TV</span><img alt="TV">
          </div>
          <!-- coffee table (image optional) -->
          <div class="slot coffee" data-item="furn-table" data-img="assets/furniture/table.png">
            <span class="hint">Coffee Table</span><img alt="Table">
          </div>
          <!-- cabinet (image optional) -->
          <div class="slot cabinet" data-item="furn-cabinet" data-img="assets/furniture/cabinet.png">
            <span class="hint">Cabinet</span><img alt="Cabinet">
          </div>
        </div>
      </section>

      <!-- KITCHEN -->
      <section class="room" id="room-kitchen">
        <span class="label">Kitchen</span>
        <div class="stage">
          <div class="slot table" data-item="furn-table" data-img="assets/furniture/table.png">
            <span class="hint">Table</span><img alt="Table">
          </div>
          <div class="slot phone" data-item="furn-phone" data-img="assets/furniture/phone.png">
            <span class="hint">Phone</span><img alt="Phone">
          </div>
        </div>
      </section>

      <!-- BEDROOM -->
      <section class="room" id="room-bedroom">
        <span class="label">Bedroom</span>
        <div class="stage">
          <div class="slot bed" data-item="furn-bed" data-img="assets/furniture/bed.png">
            <span class="hint">Bed</span><img alt="Bed">
          </div>
          <div class="slot wardrobe" data-item="furn-wardrobe" data-img="assets/furniture/wardrobe.png">
            <span class="hint">Wardrobe</span><img alt="Wardrobe">
          </div>
        </div>
      </section>

      <!-- BATHROOM -->
      <section class="room" id="room-bathroom">
        <span class="label">Bathroom</span>
        <div class="stage">
          <div class="slot bathtub" data-item="furn-bathtub" data-img="assets/furniture/bathtub.png">
            <span class="hint">Bathtub</span><img alt="Bathtub">
          </div>
        </div>
      </section>

    </div>
  </div>

  <p class="legend">Tip: placeholders are shaped like the furniture. Click to place/remove. A piece can be placed only if the user owns its shop item (e.g. <code>own_furn-sofa</code> is <code>1</code> in <code>localStorage</code>).</p>
</div>

<script>
  // ---- Ownership check: works with your existing shop sync ----
  function owns(itemId){ return localStorage.getItem("own_" + itemId) === "1"; }

  // Persist per-user layout
  const user = (localStorage.getItem("playerName") || "").trim();
  const STORE_KEY = "house_layout_" + user;

  function loadLayout(){ try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch { return {}; } }
  function saveLayout(state){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

  const state = loadLayout();

  // Init all slots
  document.querySelectorAll(".slot").forEach(slot => {
    const id = slot.dataset.item;
    const imgPath = slot.dataset.img;
    const img = slot.querySelector("img");
    if (imgPath) img.src = imgPath;

    // restore saved placement
    if (state[id]) slot.classList.add("placed");

    slot.addEventListener("click", () => {
      if (!owns(id)) {
        alert("You don't own this item yet. Buy it in the Shop.");
        return;
      }
      slot.classList.toggle("placed");
      state[id] = slot.classList.contains("placed");
      saveLayout(state);
    }, { passive:true });
  });

  // Reset
  document.getElementById("reset").addEventListener("click", () => {
    if (!confirm("Remove all placed items in your house?")) return;
    document.querySelectorAll(".slot.placed").forEach(s => s.classList.remove("placed"));
    saveLayout({});
  });
</script>

</body>
</html>
