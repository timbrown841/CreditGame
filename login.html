<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Credit Score Game</title>
  <!-- Add this in <head> of ALL pages (e.g., index.html, quickstart.html, etc.) -->
  <link rel="icon" href="assets/icons/favicon.ico" sizes="any">                <!-- legacy ICO -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/creditqlogo32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/creditqlogo16.png">

  <!-- Android/Chromium: high-res icons from manifest -->
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#00c4cc">

  <!-- iOS/iPadOS Home Screen icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/creditqlogo180.png">


  <!-- Redirect guard: if already logged in, skip to quickstart -->
  <script>
    (function () {
      try {
        const name = (localStorage.getItem('playerName') || '').trim();
        const avatar = localStorage.getItem('playerAvatar');
        if (name && avatar) {
          window.location.replace('quickstart.html');
        }
      } catch (e) { /* ignore storage errors */ }
    })();
  </script>

  <!-- Fonts and styles -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Welcome Back!</h1>
    <p>Log in to continue your credit score journey!</p>

    <form id="loginForm">
      <input type="text" id="loginUsername" placeholder="Username" required /><br />
      <input type="password" id="loginPassword" placeholder="Password" required /><br />
      <button type="submit">Login</button>
    </form>

    <p>Don't have an account? <a href="register.html">Register here</a></p>
  </div>

  <script>
    const apiBase = "https://credit-api-uhou.onrender.com";

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const username = document.getElementById("loginUsername").value.trim().toLowerCase();
      const password = document.getElementById("loginPassword").value;

      if (!username || !password) {
        alert("Please fill out all fields.");
        return;
      }

      fetch(`${apiBase}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      })
        .then(response => {
          if (!response.ok) {
            return response.text().then(text => { throw new Error(text); });
          }
          return response.json();
        })
        .then(data => {
          // ✅ Store all relevant data for quickstart & guard
          localStorage.setItem("playerName", data.username);
          localStorage.setItem("playerAvatar", data.avatar);
          localStorage.setItem("playerCoins", String(data.coins ?? 0));

          window.location.href = "quickstart.html";
        })
        .catch(err => {
          alert("❌ " + err.message);
        });
    });
  </script>
</body>
</html>
