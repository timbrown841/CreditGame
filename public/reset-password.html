<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Reset Password – Credit Quest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
</head>
<body style="font-family:system-ui; max-width:520px; margin:40px auto;">
  <h2>Set a new password</h2>
  <p id="info" style="color:#555"></p>

  <form id="resetForm">
    <input type="password" id="newPassword" placeholder="New password (min 8 chars)" required
           style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px"><br><br>
    <button type="submit" style="padding:10px 14px; background:#4f46e5; color:#fff; border:none; border-radius:8px; cursor:pointer;">
      Update password
    </button>
  </form>

  <div id="msg" style="margin-top:12px;"></div>

  <script>
    const apiBase = "https://credit-api-uhou.onrender.com"; // your API base

    const params = new URLSearchParams(location.search);
    const token = params.get("token") || "";
    const email = (params.get("email") || "").toLowerCase().trim();

    document.getElementById("info").textContent =
      email ? `Resetting password for: ${email}` : "Missing email in link.";

    document.getElementById("resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById("newPassword").value;

      const msg = document.getElementById("msg");
      msg.style.color = "#555";
      msg.textContent = "Updating…";

      try {
        const res = await fetch(`${apiBase}/reset-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, token, newPassword })
        });

        const text = await res.text();
        let data; try { data = JSON.parse(text); } catch { data = { message: text }; }

        if (!res.ok) {
          throw new Error(data.message || data.error || "Reset failed");
        }

        msg.style.color = "green";
        msg.textContent = "Password updated. You can now log in.";
        // optionally redirect after a few seconds:
        // setTimeout(()=> location.href = "login.html", 2000);
      } catch (err) {
        msg.style.color = "#d00";
        msg.textContent = err.message || "Network error.";
      }
    });
  </script>
</body>
</html>
