<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Reset Password – Credit Quest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
</head>
<body style="font-family:system-ui; max-width:520px; margin:40px auto;">
  <h2>Set a new password</h2>
  <p id="info" style="color:#555"></p>

  <form id="resetForm">
    <input type="password" id="newPassword" placeholder="New password (min 8 chars)" required
           style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px"><br><br>
    <input type="password" id="confirmPassword" placeholder="Confirm password" required
           style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px"><br><br>

    <button type="submit" style="padding:10px 14px; background:#4f46e5; color:#fff; border:none; border-radius:8px; cursor:pointer;">
      Update password
    </button>
  </form>

  <div id="msg" style="margin-top:12px;"></div>

  <script>
    // This page is served by the API (credit-api-uhou.onrender.com)
    const API_BASE = window.location.origin;
    const FRONTEND_URL = "https://creditquest.co.uk";

    // Read and validate query params
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const email = params.get('email') || '';

    const infoEl = document.getElementById('info');
    const formEl = document.getElementById('resetForm');

    if (!token || !email) {
      infoEl.textContent = "Invalid or missing reset link parameters. Please request a new password reset email.";
      formEl.querySelector('button[type="submit"]').disabled = true;
    } else {
      const shownEmail = decodeURIComponent(email);
      infoEl.textContent = `Resetting password for: ${shownEmail}`;
    }

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();

      const pwd = document.getElementById('newPassword').value.trim();
      const confirm = document.getElementById('confirmPassword').value.trim();

      if (pwd.length < 8) {
        alert("Password must be at least 8 characters.");
        return;
      }
      if (pwd !== confirm) {
        alert("Passwords do not match.");
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, token, newPassword: pwd })
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data?.message || data?.error || 'Reset failed');
        }

        alert("✅ Password updated. You can now log in.");
        // Redirect to your static site login page
        window.location.href = FRONTEND_URL + "/login.html";
      } catch (err) {
        alert("❌ " + (err.message || "Something went wrong"));
      }
    });
  </script>
</body>
</html>
