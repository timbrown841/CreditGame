<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Reset Password – Credit Quest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
</head>
<body style="font-family:system-ui; max-width:520px; margin:40px auto;">
  <h2>Set a new password</h2>
  <p id="info" style="color:#555"></p>

  <form id="resetForm">
    <input type="password" id="newPassword" placeholder="New password (min 8 chars)" required
           style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px"><br><br>
    <button type="submit" style="padding:10px 14px; background:#4f46e5; color:#fff; border:none; border-radius:8px; cursor:pointer;">
      Update password
    </button>
  </form>

  <div id="msg" style="margin-top:12px;"></div>

  <script>
  const apiBase = window.location.origin; // since page is served by the API itself

  // Read query params
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token') || '';
  const email = params.get('email') || '';

  // Handle form submit
  async function submitNewPassword(e) {
    e.preventDefault();
    const newPassword = document.getElementById('newPassword').value;
    const confirm     = document.getElementById('confirmPassword').value;

    if (!newPassword || newPassword.length < 8) {
      alert("Password must be at least 8 characters.");
      return;
    }
    if (newPassword !== confirm) {
      alert("Passwords do not match.");
      return;
    }

    try {
      const res = await fetch(`${apiBase}/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, token, newPassword })
      });
      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        throw new Error(data?.message || data?.error || 'Reset failed');
      }

      alert("✅ Password updated. You can now log in.");
      window.location.href = '/login.html';
    } catch (err) {
      alert("❌ " + (err.message || "Something went wrong"));
    }
  }
  </script>
</body>
</html>
