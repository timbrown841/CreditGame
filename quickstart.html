<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Credit Score Adventure</title>
	<!-- Add this line below -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container" id="loginContainer">
    <h1>Welcome to Credit Score Adventure!</h1>
    <p>Please enter your name to begin:</p>
    <input type="text" id="playerName" placeholder="Your name" />
    <br>
    <button id="loginBtn" type="button">Login</button>
  </div>

  <div class="container" id="quizContainer" style="display: none;">
    <div id="quizContent"></div>
  </div>

  <div id="trophyModal">
    <h3>🏆 Trophy Unlocked!</h3>
    <p>You earned a medal for your perfect score!</p>
    <button type="button" onclick="closeTrophyModal()">Close</button>
  </div>

  <!-- Rocket + Trail -->
  <img src="assets/rocket.png" class="rocket-fly" alt="rocket" />
  <div class="rocket-trail"></div>

  <!-- Stars -->
  <div class="twinkle star1"></div>
  <div class="twinkle star2"></div>
  <div class="twinkle star3"></div>
	
<div class="avatar-container">
  <h3>Welcome, <span id="displayName"></span>!</h3>
  <img id="avatarDisplay" src="" alt="Your Avatar" class="avatar-image" />
	<div id="coinDisplay" class="coin-balance">💰 Coins: 0</div>
</div>

  <script src="script.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const name = localStorage.getItem("playerName");
    const avatar = localStorage.getItem("playerAvatar");
	const coins = localStorage.getItem("coins");

    if (name && avatar) {
      document.getElementById("displayName").textContent = name;
      document.getElementById("avatarDisplay").src = `assets/avatars/${avatar}`;
    } else {
      // Redirect if not logged in
      window.location.href = "login.html";
    }
  });
</script>
	
</body>
</html>
