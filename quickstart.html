<!-- File: quickstart.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Credit Score Adventure</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Go straight to quiz; name prompt removed -->
  <div class="container" id="quizContainer">
    <div id="quizContent"></div>
  </div>

  <div id="trophyModal">
    <h3>🏆 Trophy Unlocked!</h3>
    <p>You earned a medal for your perfect score!</p>
    <button type="button" onclick="closeTrophyModal()">Close</button>
  </div>

  <!-- Rocket + Trail -->
  <img src="assets/rocket.png" class="rocket-fly" alt="rocket" />
  <div class="rocket-trail"></div>

  <!-- Stars -->
  <div class="twinkle star1"></div>
  <div class="twinkle star2"></div>
  <div class="twinkle star3"></div>

  <script src="script.js"></script>
  <script>
    // why: ensure quiz shows even if older script.js expected a name step
    document.addEventListener('DOMContentLoaded', function () {
      var qc = document.getElementById('quizContainer');
      if (qc) qc.style.display = 'block';
      var lc = document.getElementById('loginContainer');
      if (lc) lc.style.display = 'none';
    });
  </script>
</body>
</html>
