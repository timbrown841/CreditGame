<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - Credit Score Game</title>

  <!-- Fredoka font -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <!-- Add this in <head> of ALL pages (e.g., index.html, quickstart.html, etc.) -->
  <link rel="icon" href="assets/icons/favicon.ico" sizes="any">                <!-- legacy ICO -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/creditqlogo32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/creditqlogo16.png">

  <!-- Android/Chromium: high-res icons from manifest -->
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#00c4cc">

  <!-- iOS/iPadOS Home Screen icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/creditqlogo180.png">

</head>
<body>
  <div class="container">
    <h1>Create Your Account</h1>
    <p>Enter your details to start your credit score adventure!</p>

    <form id="registerForm">
      <input type="text" id="regUsername" placeholder="Username" required /><br />
      <input type="email" id="regEmail" placeholder="Email" required /><br />
      <input type="password" id="regPassword" placeholder="Password" required /><br />

      <label for="avatar">Choose your avatar:</label>
      <div class="avatar-picker">
        <label>
          <input type="radio" name="avatar" value="blackboy.png" checked />
          <img src="assets/avatars/blackboy.png" alt="Avatar 1" />
        </label>
        <label>
          <input type="radio" name="avatar" value="blackgirl.png" />
          <img src="assets/avatars/blackgirl.png" alt="Avatar 2" />
        </label>
        <label>
          <input type="radio" name="avatar" value="latinboy.png" />
          <img src="assets/avatars/latinboy.png" alt="Avatar 3" />
        </label>
        <label>
          <input type="radio" name="avatar" value="whiteboy.png" />
          <img src="assets/avatars/whiteboy.png" alt="Avatar 4" />
        </label>
        <label>
          <input type="radio" name="avatar" value="whitegirl.png" />
          <img src="assets/avatars/whitegirl.png" alt="Avatar 5" />
        </label>
      </div>

      <button type="submit">Register</button>
    </form>

    <p>Already have an account? <a href="login.html">Login here</a></p>
  </div>

  <script>
    const apiBase = "https://credit-api-uhou.onrender.com";

    document.getElementById("registerForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const username = document.getElementById("regUsername").value.trim().toLowerCase();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value;
      const avatar = document.querySelector('input[name="avatar"]:checked').value;

      if (!username || !email || !password || !avatar) {
        alert("Please fill out all fields.");
        return;
      }

      fetch(`${apiBase}/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, email, password, avatar })
      })
      .then(response => {
        if (!response.ok) return response.text().then(text => { throw new Error(text); });
        return response.text();
      })
      .then(() => {
        alert("✅ Registered successfully! Please login.");
        window.location.href = "login.html";
      })
      .catch(err => {
        alert("❌ " + err.message);
      });
    });
  </script>
</body>
</html>
