<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Terms of Use - Credit Quest</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Fredoka', sans-serif; }
    body {
      background-image: url("assets/bg-kids.jpg");
      background-size: cover;
      background-position: center;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .overlay {
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 20px;
      border-radius: 15px;
      width: 90%;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    h1 { font-size: 1.8rem; margin-bottom: 10px; }
    p { font-size: 1rem; margin: 8px 0; line-height: 1.5; }
    ul { text-align: left; margin: 10px 0 0 18px; }
    li { margin: 6px 0; }
    button {
      font-size: 1rem;
      padding: 12px 25px;
      background-color: #4CAF50;
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-top: 14px;
    }
    button:hover { background-color: #388e3c; }
  </style>
</head>
<body>
  <div class="overlay">
    <h1>Terms of Use</h1>
<p>Placeholder. Add your terms: acceptable use, accounts, disclaimers, limitations, termination, governing law.</p>
